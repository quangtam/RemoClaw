<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="claw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#e63946"/>
    </linearGradient>
    <linearGradient id="signal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4cc9f0"/>
      <stop offset="100%" style="stop-color:#7209b7"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#a0a0c0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <path d="M 0 100 L 1280 100" stroke="#fff" stroke-width="1"/>
    <path d="M 0 200 L 1280 200" stroke="#fff" stroke-width="1"/>
    <path d="M 0 300 L 1280 300" stroke="#fff" stroke-width="1"/>
    <path d="M 0 400 L 1280 400" stroke="#fff" stroke-width="1"/>
    <path d="M 0 500 L 1280 500" stroke="#fff" stroke-width="1"/>
    <path d="M 100 0 L 100 640" stroke="#fff" stroke-width="1"/>
    <path d="M 300 0 L 300 640" stroke="#fff" stroke-width="1"/>
    <path d="M 500 0 L 500 640" stroke="#fff" stroke-width="1"/>
    <path d="M 800 0 L 800 640" stroke="#fff" stroke-width="1"/>
    <path d="M 1000 0 L 1000 640" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- ═══ LEFT SIDE: Branding ═══ -->

  <!-- Logo glow background -->
  <circle cx="280" cy="280" r="180" fill="url(#glow)"/>

  <!-- Logo: Claw + signal -->
  <!-- Signal waves -->
  <path d="M 195 220 A 60 60 0 0 1 230 185" fill="none" stroke="url(#signal-grad)" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  <path d="M 178 235 A 90 90 0 0 1 245 168" fill="none" stroke="url(#signal-grad)" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
  <path d="M 160 250 A 120 120 0 0 1 260 150" fill="none" stroke="url(#signal-grad)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Claw -->
  <path d="M 240 290 C 240 240, 265 215, 290 230 C 305 240, 295 260, 280 275 L 295 295 Z"
        fill="url(#claw-grad)" opacity="0.95"/>
  <path d="M 360 290 C 360 240, 335 215, 310 230 C 295 240, 305 260, 320 275 L 305 295 Z"
        fill="url(#claw-grad)" opacity="0.95"/>
  <ellipse cx="300" cy="330" rx="60" ry="48" fill="url(#claw-grad)" opacity="0.92"/>
  <circle cx="300" cy="290" r="16" fill="#ff8c61"/>

  <!-- Title: RemoClaw -->
  <text x="80" y="500" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="92" font-weight="800" fill="url(#title-grad)" letter-spacing="-2">
    RemoClaw
  </text>

  <!-- Tagline -->
  <text x="80" y="545" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#a0a0c0" letter-spacing="0.5">
    Remote control any AI coding agent from your phone
  </text>

  <!-- ═══ RIGHT SIDE: Phone with chat ═══ -->

  <!-- Phone outline -->
  <rect x="780" y="100" width="380" height="500" rx="40" ry="40" fill="#0d1117" stroke="#30363d" stroke-width="3"/>
  <rect x="800" y="135" width="340" height="430" rx="8" ry="8" fill="#161b22"/>

  <!-- Phone notch -->
  <rect x="900" y="115" width="140" height="22" rx="11" fill="#0d1117"/>

  <!-- Phone home indicator -->
  <rect x="930" y="585" width="80" height="4" rx="2" fill="#30363d"/>

  <!-- Telegram-style chat content -->

  <!-- Status bar -->
  <text x="820" y="160" font-family="monospace" font-size="11" fill="#8b949e">9:41</text>
  <text x="1080" y="160" font-family="monospace" font-size="11" fill="#8b949e">📶 5G</text>

  <!-- Header: RemoClaw bot -->
  <rect x="800" y="170" width="340" height="48" fill="#21262d"/>
  <circle cx="824" cy="194" r="14" fill="#ff6b35"/>
  <text x="819" y="199" font-family="system-ui, sans-serif" font-size="14" fill="#fff">🦞</text>
  <text x="848" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">RemoClaw</text>
  <text x="848" y="206" font-family="system-ui, sans-serif" font-size="10" fill="#7ee787">● online</text>

  <!-- User message bubble (right) -->
  <rect x="900" y="240" width="220" height="50" rx="14" fill="#1f6feb"/>
  <text x="916" y="262" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff">Add dark mode to the</text>
  <text x="916" y="280" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff">navbar component</text>

  <!-- Bot streaming response (left) -->
  <rect x="820" y="305" width="280" height="92" rx="14" fill="#21262d"/>
  <text x="836" y="327" font-family="system-ui, sans-serif" font-size="11" fill="#7ee787">▸ Reading src/components/Navbar.tsx</text>
  <text x="836" y="345" font-family="system-ui, sans-serif" font-size="11" fill="#7ee787">▸ Editing 3 files...</text>
  <text x="836" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">✅ Added dark mode toggle</text>
  <text x="836" y="383" font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">   3 files updated</text>

  <!-- Decision prompt -->
  <rect x="820" y="412" width="280" height="60" rx="14" fill="#3d2817" stroke="#d29922" stroke-width="1.5"/>
  <text x="836" y="432" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#d29922">⚠️ CLI is waiting for input</text>
  <text x="836" y="450" font-family="monospace" font-size="10" fill="#8b949e">&gt; Run tests now? [Y/n]</text>
  <text x="836" y="465" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">Reply to proceed.</text>

  <!-- Voice message indicator -->
  <rect x="900" y="490" width="220" height="38" rx="14" fill="#1f6feb"/>
  <circle cx="922" cy="509" r="10" fill="#ffffff"/>
  <text x="918" y="514" font-family="monospace" font-size="11" fill="#1f6feb">▶</text>
  <text x="942" y="498" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" opacity="0.85">0:08</text>
  <!-- Waveform -->
  <rect x="942" y="504" width="3" height="10" fill="#ffffff" opacity="0.7"/>
  <rect x="947" y="500" width="3" height="18" fill="#ffffff" opacity="0.7"/>
  <rect x="952" y="503" width="3" height="12" fill="#ffffff" opacity="0.7"/>
  <rect x="957" y="497" width="3" height="24" fill="#ffffff" opacity="0.7"/>
  <rect x="962" y="501" width="3" height="16" fill="#ffffff" opacity="0.7"/>
  <rect x="967" y="505" width="3" height="8" fill="#ffffff" opacity="0.7"/>
  <rect x="972" y="500" width="3" height="18" fill="#ffffff" opacity="0.7"/>
  <rect x="977" y="503" width="3" height="12" fill="#ffffff" opacity="0.7"/>
  <rect x="982" y="498" width="3" height="22" fill="#ffffff" opacity="0.7"/>
  <rect x="987" y="502" width="3" height="14" fill="#ffffff" opacity="0.7"/>

  <!-- Input area -->
  <rect x="800" y="540" width="340" height="25" fill="#161b22"/>
  <text x="820" y="558" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">💬 Message</text>
  <text x="1115" y="558" font-family="system-ui, sans-serif" font-size="14" fill="#1f6feb">🎤</text>

  <!-- ═══ Bottom: Agent badges ═══ -->

  <g transform="translate(80, 580)">
    <!-- Kiro -->
    <rect x="0" y="0" width="80" height="28" rx="14" fill="#21262d" stroke="#7c3aed" stroke-width="1"/>
    <text x="40" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">⚡ Kiro</text>

    <!-- Claude Code -->
    <rect x="90" y="0" width="110" height="28" rx="14" fill="#21262d" stroke="#7c3aed" stroke-width="1"/>
    <text x="145" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">🟣 Claude Code</text>

    <!-- Gemini -->
    <rect x="210" y="0" width="100" height="28" rx="14" fill="#21262d" stroke="#7c3aed" stroke-width="1"/>
    <text x="260" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">💎 Gemini CLI</text>

    <!-- Codex -->
    <rect x="320" y="0" width="100" height="28" rx="14" fill="#21262d" stroke="#7c3aed" stroke-width="1"/>
    <text x="370" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">🟢 Codex</text>
  </g>

  <!-- Subtle URL/handle bottom-right -->
  <text x="1200" y="618" text-anchor="end" font-family="monospace" font-size="11" fill="#6e7681">github.com/quangtam/RemoClaw</text>
</svg>
